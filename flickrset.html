<html>
<head> <title> New Tab </title>
<style>
  html {
    background-color: black;
  }
  #byline {
    position: absolute;
    top: 9px;
    right: 9px;
  }
  #wrapper {
    background-color: rgba(255,255,255,1);
    color: #666;
    opacity: 0;
    transition-property: opacity;
    transition-duration: 0.8s;
    padding: 0.4em;
    border-radius: 0.3em;
    padding-left: 2em;
    padding-right: 2em;
    padding-top: 0.3em;
    font-family: sans-serif;
    font-size: 13px;
    display: inline-block;
    vertical-align:middle;
    border: 1px solid #ccc;
  }
  a:link, a:visited {
    color: #333;
    text-decoration: none;
  }
  span.title {
    font-size: large;
  }
  span.owner {
    font-size: small;
  }

  #stage {
    position: absolute;
    top: 0px;
    left: 0px;
    transform-style: preserve-3d;
    perspective: 800px;
  }
  #bg {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    transform-origin: 50% 50%;
    transition-property: transform;
    transform: scale(1.2);
    transform-style: preserve-3d;
    transition-duration: 10s;
    overflow: hidden;
  }
  #bg img {
    position: absolute;
    top: 0px;
    left: 0px;
    transform-origin: 0% 0%;
    opacity: 0;
    transition-property: opacity;
    transition-duration: 1s;
  }
  body {
    overflow: hidden;
  }

</style>

<script src="flickrset.js"></script>

</head>
    <body>
      <div id="stage">
        <div id="bg"></div>
      </div>
      <div id="byline">
        <a href="#" id="wrapper"></a>
      </div>
    </body>
</html>
